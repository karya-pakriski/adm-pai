<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrasi PAI — Generator Dokumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --ink:#1B2A28; --ink-soft:#5B6C67; --ink-faint:#8C9C97;
    --bg:#F6F4EE; --surface:#FFFFFF; --surface-alt:#FBF9F3;
    --border:#E3DFD2; --border-soft:#ECE9DE;
    --primary:#0E5C4E; --primary-dark:#093F35; --primary-soft:#E3F0EC;
    --gold:#B8912E; --gold-soft:#F5EDD6;
    --sidebar-bg:#0C1F1B; --sidebar-bg-alt:#15342D;
    --sidebar-text:#D3E4DE; --sidebar-text-dim:#7FA097;
    --danger:#B3452F; --danger-dark:#94341F;
    --info:#2B6F86; --info-dark:#205567;
    --success:#3D8361;
    --radius-lg:20px; --radius:14px; --radius-sm:9px;
    --shadow-sm:0 2px 10px rgba(12,31,27,.06);
    --shadow-md:0 14px 34px rgba(12,31,27,.12);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
    --ease:cubic-bezier(.4,0,.2,1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font-body); background:var(--bg); color:var(--ink);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .hidden{ display:none !important; }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ============ SCROLLBAR MODERN ============ */
  *{ scrollbar-width:thin; scrollbar-color:var(--primary-soft) transparent; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#C7DCD5; border-radius:999px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--primary); }
  .sidebar ::-webkit-scrollbar-thumb{ background:rgba(211,228,222,.25); }
  .sidebar ::-webkit-scrollbar-thumb:hover{ background:rgba(211,228,222,.45); }
  .sidebar{ scrollbar-color:rgba(211,228,222,.25) transparent; }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes slideIn{ from{ transform:translateX(110%); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  @keyframes fadeOut{ to{ opacity:0; transform:translateY(-8px); } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  .spinner{
    border:3px solid rgba(14,92,78,.12); border-top:3px solid var(--primary);
    border-radius:50%; width:38px; height:38px; animation:spin .9s linear infinite; margin:24px auto;
  }

  /* ============ SIGNATURE MOTIF (rub el-hizb, dipakai hemat) ============ */
  .motif-dark{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='rgb(184,145,46)' stroke-width='0.6' opacity='0.5'><rect x='14' y='14' width='28' height='28'/><rect x='14' y='14' width='28' height='28' transform='rotate(45 28 28)'/></g></svg>");
    background-size:64px 64px;
  }
  .motif-light{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='rgb(14,92,78)' stroke-width='0.6' opacity='0.16'><rect x='14' y='14' width='28' height='28'/><rect x='14' y='14' width='28' height='28' transform='rotate(45 28 28)'/></g></svg>");
    background-size:64px 64px;
  }

  .brand-mark{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(155deg, var(--primary), var(--primary-dark));
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm);
  }
  .brand-mark svg{ width:22px; height:22px; }

  /* ============ LOGIN ============ */
  #login-section{ display:flex; align-items:center; justify-content:center; height:100vh; padding:20px; }
  .login-card{
    position:relative; background:var(--surface); width:400px; max-width:100%;
    border-radius:var(--radius-lg); box-shadow:var(--shadow-md); overflow:hidden;
    border:1px solid var(--border-soft); animation:fadeUp .5s var(--ease);
  }
  .login-hero{
    position:relative; padding:34px 32px 28px; background:var(--primary-dark); color:#fff; overflow:hidden;
  }
  .login-hero::before{ content:''; position:absolute; inset:0; }
  .login-hero-inner{ position:relative; z-index:1; display:flex; align-items:center; gap:14px; }
  .login-hero h1{ font-family:var(--font-display); font-weight:600; font-size:21px; letter-spacing:.2px; }
  .login-hero p{ font-size:12.5px; color:rgba(255,255,255,.68); margin-top:2px; }

  .login-body{ padding:28px 32px 32px; }
  .form-group{ margin-bottom:16px; text-align:left; }
  .form-group label{ display:block; margin-bottom:6px; font-weight:600; font-size:13px; color:var(--ink-soft); }
  .form-group input{
    width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    font-size:14px; font-family:var(--font-body); background:var(--surface-alt);
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .form-group input:focus{ border-color:var(--primary); background:#fff; outline:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border:none; border-radius:var(--radius-sm); cursor:pointer;
    font-size:13.5px; font-weight:600; font-family:var(--font-body); color:#fff;
    transition:filter .15s var(--ease), transform .1s var(--ease);
  }
  .btn:active{ transform:translateY(1px); }
  .btn:hover{ filter:brightness(1.08); }
  .btn-primary{ background:var(--primary); width:100%; padding:12px; }
  .btn-danger{ background:var(--danger); }
  .btn-info{ background:var(--info); }
  .btn-close{ background:var(--surface-alt); color:var(--ink-soft); border:1.5px solid var(--border); }
  .btn-close:hover{ filter:none; background:var(--border-soft); }

  .btn-loading{ cursor:not-allowed; opacity:.75; }
  .spinner-btn{
    width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top:2px solid #fff;
    border-radius:50%; animation:spin .7s linear infinite;
  }

  /* ============ TOAST ============ */
  #toast-container{ position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
  .toast{
    padding:13px 18px; border-radius:var(--radius-sm); color:#fff; font-size:13.5px; font-weight:500;
    box-shadow:var(--shadow-md); max-width:340px;
    animation:slideIn .3s var(--ease), fadeOut .4s ease 3s forwards;
  }
  .toast-success{ background:var(--success); }
  .toast-error{ background:var(--danger); }
  .toast-info{ background:var(--info); }

  /* ============ DASHBOARD SHELL ============ */
  #dashboard-section{ display:flex; height:100vh; }

  .topbar-mobile{
    display:none; align-items:center; gap:12px; padding:14px 18px;
    background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  .hamburger{
    width:38px; height:38px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .hamburger span, .hamburger span::before, .hamburger span::after{
    display:block; width:16px; height:2px; background:var(--ink); position:relative; border-radius:2px;
  }
  .hamburger span::before, .hamburger span::after{ content:''; position:absolute; }
  .hamburger span::before{ top:-5px; } .hamburger span::after{ top:5px; }

  .sidebar{
    width:272px; background:var(--sidebar-bg); color:var(--sidebar-text);
    display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto;
    transition:transform .25s var(--ease);
  }
  .sidebar-header{
    position:relative; padding:22px 20px 20px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid rgba(211,228,222,.10); background:var(--sidebar-bg-alt);
  }
  .sidebar-header::after{ content:''; position:absolute; inset:0; pointer-events:none; }
  .sidebar-header-text h2{ font-family:var(--font-display); font-size:16.5px; font-weight:600; color:#fff; }
  .sidebar-header-text p{ font-size:11px; color:var(--sidebar-text-dim); margin-top:1px; letter-spacing:.3px; }

  .sidebar-menu{ flex:1; overflow-y:auto; padding:14px 0; }
  .menu-top{ list-style:none; }
  .menu-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 20px; background:transparent; color:var(--sidebar-text); border:none;
    cursor:pointer; font-size:14px; font-weight:500; font-family:var(--font-body);
    border-left:3px solid transparent; transition:background .15s var(--ease), border-color .15s var(--ease);
  }
  .menu-item:hover{ background:rgba(255,255,255,.05); }
  .menu-item.active{ background:rgba(255,255,255,.06); border-left-color:var(--gold); color:#fff; }
  .menu-icon{ font-size:16px; width:18px; text-align:center; }

  .kelas-nav{ background:rgba(0,0,0,.14); }
  .kelas-toggle, .kategori-toggle{
    width:100%; text-align:left; padding:10px 20px; background:transparent; color:var(--sidebar-text);
    border:none; cursor:pointer; font-size:13px; font-weight:500;
    border-bottom:1px solid rgba(255,255,255,.05); display:flex; align-items:center; justify-content:space-between;
    transition:background .15s var(--ease);
  }
  .kelas-toggle:hover, .kategori-toggle:hover{ background:rgba(255,255,255,.06); }
  .kelas-toggle{ padding-left:20px; font-weight:600; color:#fff; }
  .kategori-toggle{ padding-left:38px; font-size:12.5px; color:var(--sidebar-text-dim); }
  .chev{ font-size:10px; opacity:.7; transition:transform .2s var(--ease); }
  .kategori-container{ background:rgba(0,0,0,.10); }
  .dokumen-list{ list-style:none; }
  .dokumen-list li a{
    display:block; padding:9px 48px; color:var(--sidebar-text); text-decoration:none;
    font-size:12.5px; border-left:2px solid transparent; transition:background .15s var(--ease), color .15s var(--ease);
  }
  .dokumen-list li a:hover{ background:rgba(184,145,46,.12); color:var(--gold); border-left-color:var(--gold); }

  .sidebar-footer{ padding:16px 20px; border-top:1px solid rgba(255,255,255,.08); }
  .btn-logout{
    width:100%; background:transparent; color:#E7B8A9; border:1.5px solid rgba(231,184,169,.3);
    padding:10px; border-radius:var(--radius-sm); font-weight:600; font-size:13px; cursor:pointer;
    transition:background .15s var(--ease);
  }
  .btn-logout:hover{ background:rgba(179,69,47,.18); }

  /* ============ MAIN CONTENT ============ */
  .main-content{ flex:1; padding:34px 38px; overflow-y:auto; }
  .main-content h3{ font-family:var(--font-display); font-size:22px; font-weight:600; margin-bottom:6px; color:var(--ink); }
  .placeholder-text{ color:var(--ink-faint); font-size:14px; }
  .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--primary); margin-bottom:6px; }

  /* ---- Folder Kelas ---- */
  .folder-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:14px; margin-top:20px; }
  .folder-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:10px; text-align:left;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:18px; cursor:pointer; font-family:var(--font-body); box-shadow:var(--shadow-sm);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .folder-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--primary-soft); }
  .folder-icon{
    width:42px; height:42px; border-radius:11px; background:var(--gold-soft); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .folder-info strong{ display:block; font-size:15px; color:var(--ink); font-family:var(--font-display); font-weight:600; }
  .folder-info span{ font-size:12px; color:var(--ink-faint); }

  .breadcrumb{ margin-bottom:18px; }
  .btn-link{
    background:none; border:none; color:var(--primary); font-weight:600; font-size:13px;
    cursor:pointer; padding:0; font-family:var(--font-body);
  }
  .btn-link:hover{ text-decoration:underline; }

  .kategori-block{ margin-bottom:22px; }
  .kategori-title{
    font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border-soft);
  }
  .doc-list{ display:flex; flex-direction:column; gap:8px; }
  .doc-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
    padding:12px 16px; transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .doc-item:hover{ border-color:var(--primary-soft); background:var(--surface-alt); }
  .doc-item-info{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink); }
  .doc-icon{ font-size:17px; }
  .btn-primary-outline{
    background:transparent; border:1.5px solid var(--primary); color:var(--primary);
    padding:7px 14px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:var(--font-body); transition:background .15s var(--ease), color .15s var(--ease);
    white-space:nowrap;
  }
  .btn-primary-outline:hover{ background:var(--primary); color:#fff; }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-faint);
  }
  .empty-state .empty-icon{ font-size:40px; margin-bottom:10px; }

  .total-card{
    background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff;
    border-radius:var(--radius-lg); padding:24px 26px; display:flex; align-items:center; gap:20px;
    margin:22px 0; max-width:320px; box-shadow:var(--shadow-md);
  }
  .total-icon{ font-size:36px; }
  .total-info h2{ font-family:var(--font-display); font-size:38px; font-weight:600; }
  .total-info p{ font-size:12.5px; color:rgba(255,255,255,.75); }

  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-top:8px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .stat-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .stat-icon{
    width:38px; height:38px; border-radius:10px; background:var(--primary-soft); color:var(--primary);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .stat-info h4{ font-family:var(--font-mono); font-size:21px; color:var(--ink); }
  .stat-info p{ font-size:12px; color:var(--ink-soft); }

  .content-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
    padding:26px; margin-bottom:20px; box-shadow:var(--shadow-sm);
  }
  .profile-table{ width:100%; border-collapse:collapse; }
  .profile-table td{ padding:12px 4px; border-bottom:1px solid var(--border-soft); font-size:14px; }
  .profile-table td:first-child{ font-weight:600; width:38%; color:var(--ink-soft); }
  .profile-table td:last-child{ font-family:var(--font-mono); font-size:13.5px; }

  .toolbar{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; }
  .toolbar h3{ margin:0; }
  .toolbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .date-field{
    font-size:13px; display:flex; align-items:center; gap:8px; background:var(--surface-alt);
    border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:7px 12px; color:var(--ink-soft); font-weight:500;
  }
  .date-field input[type="date"]{
    border:none; background:transparent; font-size:13px; font-family:var(--font-body); color:var(--ink); cursor:pointer;
  }
  .date-field input[type="date"]:focus{ outline:none; }

  .preview-container{
    width:100%; height:calc(100vh - 210px); min-height:460px; border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden; background:#fff; box-shadow:var(--shadow-sm);
  }
  .preview-container iframe{ width:100%; height:100%; border:none; }

  @media (max-width: 860px){
    .topbar-mobile{ display:flex; }
    #dashboard-section{ flex-direction:column; }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:30; transform:translateX(-100%);
      box-shadow:var(--shadow-md);
    }
    .sidebar.open{ transform:translateX(0); }
    .main-content{ padding:22px; }
    .preview-container{ height:calc(100vh - 260px); }
  }
</style>
</head>
<body>

  <!-- ========== LOGIN ========== -->
  <section id="login-section">
    <div class="login-card">
      <div class="login-hero motif-dark">
        <div class="login-hero-inner">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#B8912E" stroke-width="1.4">
              <rect x="7" y="7" width="10" height="10"/>
              <rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)"/>
            </svg>
          </div>
          <div>
            <h1>Administrasi PAI</h1>
            <p>Generator Dokumen Kurikulum Merdeka</p>
          </div>
        </div>
      </div>
      <div class="login-body">
        <form id="login-form">
          <div class="form-group">
            <label for="login-id">ID / NIP</label>
            <input type="text" id="login-id" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="login-pin">PIN</label>
            <input type="password" id="login-pin" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary">Masuk</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ========== DASHBOARD ========== -->
  <section id="dashboard-section" class="hidden">
    <div class="topbar-mobile">
      <button class="hamburger" id="hamburger-btn" aria-label="Buka menu"><span></span></button>
      <strong style="font-family:var(--font-display); font-size:15px;">Adm. PAI</strong>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header motif-dark">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#B8912E" stroke-width="1.4">
            <rect x="7" y="7" width="10" height="10"/>
            <rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)"/>
          </svg>
        </div>
        <div class="sidebar-header-text">
          <h2>Adm. PAI</h2>
          <p>DASHBOARD GURU</p>
        </div>
      </div>
      <div class="sidebar-menu">
        <ul class="menu-top">
          <li><button class="menu-item" data-menu="dashboard"><span class="menu-icon">🏠</span> Dashboard</button></li>
          <li>
            <button class="menu-item" data-menu="kelas"><span class="menu-icon">📁</span> Kelas</button>
            <div id="kelas-nav" class="kelas-nav hidden"></div>
          </li>
          <li><button class="menu-item" data-menu="profil"><span class="menu-icon">👤</span> Informasi Profil</button></li>
        </ul>
      </div>
      <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">Keluar</button>
      </div>
    </aside>

    <main class="main-content" id="main-content"></main>
  </section>

  <div id="toast-container"></div>

  <script>
    // ================== KONFIGURASI ==================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwuTUbmIfn--kitwVwnjcDtIYeSppW7JPMFHHdWaerO1wAc64t5kTF6Alp8qygMIo2r8Q/exec';
    const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/karya-pakriski/adm-pai/main/template/';
    const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    // ================== STATE ==================
    let currentUser = null;
    let currentTemplates = [];
    let currentDocFile = '';
    let currentDocTitle = '';
    let currentMenu = 'dashboard';
    let currentTemplateRawHtml = '';
    let currentTanggal = '';
    let kelasFolderView = null; // null = tampilkan grid folder kelas

    const qs = (sel) => document.querySelector(sel);
    const qsa = (sel) => document.querySelectorAll(sel);

    // ================== TANGGAL HELPERS ==================
    function getTodayISO(){
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function formatTanggalIndonesia(iso){
      const [y,m,d] = iso.split('-').map(Number);
      return `${d} ${BULAN_ID[m-1]} ${y}`;
    }

    // ================== INISIALISASI ==================
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = sessionStorage.getItem('user');
      if (savedUser) { currentUser = JSON.parse(savedUser); showDashboard(); }
      else showLogin();

      qsa('.menu-item').forEach(btn => btn.addEventListener('click', () => setActiveMenu(btn.dataset.menu)));

      qs('#hamburger-btn')?.addEventListener('click', () => qs('#sidebar').classList.toggle('open'));
    });

    function showLogin(){
      qs('#login-section').classList.remove('hidden');
      qs('#dashboard-section').classList.add('hidden');
    }
    function showDashboard(){
      qs('#login-section').classList.add('hidden');
      qs('#dashboard-section').classList.remove('hidden');
      setActiveMenu('dashboard'); // bangun markup dulu, baru muat data (hindari crash cache)
      loadTemplates();
    }

    // ================== TOAST ==================
    function showToast(message, type = 'info'){
      const container = qs('#toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    // ================== LOADER HELPERS ==================
    function setButtonLoading(btn, isLoading, loadingText = 'Memproses...'){
      if (isLoading){
        btn.dataset.originalText = btn.innerHTML;
        btn.innerHTML = `<span class="spinner-btn"></span> ${loadingText}`;
        btn.classList.add('btn-loading');
        btn.disabled = true;
      } else {
        btn.innerHTML = btn.dataset.originalText;
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    }
    function showContentLoader(){
      qs('#main-content').innerHTML = `<div class="spinner"></div><p class="placeholder-text" style="text-align:center;">Memuat...</p>`;
    }

    // ================== MENU UTAMA ==================
    function setActiveMenu(menu){
      currentMenu = menu;
      if (menu === 'kelas') kelasFolderView = null; // klik menu utama Kelas selalu mulai dari grid
      qsa('.menu-item').forEach(btn => btn.classList.toggle('active', btn.dataset.menu === menu));
      const kelasNav = qs('#kelas-nav');
      kelasNav.classList.toggle('hidden', menu !== 'kelas');
      qs('#sidebar').classList.remove('open');
      renderMainContent(menu);
    }

    function renderMainContent(menu){
      const main = qs('#main-content');
      switch (menu){
        case 'dashboard': renderDashboardContent(); break;
        case 'kelas': renderKelasContent(); break;
        case 'profil': renderProfileContent(); break;
        default: main.innerHTML = `<h3>Selamat datang</h3>`;
      }
    }

    // ================== TAMPILAN FOLDER KELAS (main content) ==================
    function renderKelasContent(){
      const main = qs('#main-content');

      if (currentTemplates.length === 0){
        main.innerHTML = `
          <div class="eyebrow">Kelas</div>
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <p>Daftar dokumen belum termuat. Coba muat ulang halaman.</p>
          </div>
        `;
        return;
      }

      if (!kelasFolderView){
        const kelasList = [...new Set(currentTemplates.map(t => t.KELAS || 'Lainnya'))]
          .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

        main.innerHTML = `
          <div class="eyebrow">Kelas</div>
          <h3>Pilih Kelas</h3>
          <p class="placeholder-text">Pilih folder kelas untuk melihat dokumen yang tersedia.</p>
          <div class="folder-grid">
            ${kelasList.map(k => {
              const count = currentTemplates.filter(t => (t.KELAS || 'Lainnya') === k).length;
              return `
                <button class="folder-card" onclick="openKelasFolder('${k}')">
                  <div class="folder-icon">📁</div>
                  <div class="folder-info">
                    <strong>Kelas ${k}</strong>
                    <span>${count} dokumen</span>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      const docsInKelas = currentTemplates.filter(t => (t.KELAS || 'Lainnya') === kelasFolderView);
      const byKategori = {};
      docsInKelas.forEach(t => {
        const kat = t.KATEGORI || 'Umum';
        (byKategori[kat] ??= []).push(t);
      });

      main.innerHTML = `
        <div class="eyebrow">Kelas</div>
        <div class="breadcrumb">
          <button class="btn-link" onclick="backToKelasGrid()">← Semua Kelas</button>
          <h3 style="margin-top:8px;">Kelas ${kelasFolderView}</h3>
        </div>
        ${Object.keys(byKategori).sort().map(kat => `
          <div class="kategori-block">
            <h4 class="kategori-title">${kat}</h4>
            <div class="doc-list">
              ${byKategori[kat].map(tpl => `
                <div class="doc-item">
                  <div class="doc-item-info">
                    <span class="doc-icon">${kategoriIcon(kat)}</span>
                    <span>${tpl.JUDUL || tpl.ID_TEMPLATE}</span>
                  </div>
                  <button class="btn-primary-outline" onclick="openPreviewById('${tpl.ID_TEMPLATE}')">Lihat &amp; Unduh</button>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      `;
    }

    function kategoriIcon(kat){
      const map = { CP:'🎯', ATP:'🗺️', RPP:'📘', PROTA:'📅', PROMES:'🗓️' };
      return map[(kat || '').toUpperCase()] || '📁';
    }
    function openKelasFolder(kelas){ kelasFolderView = kelas; renderKelasContent(); }
    function backToKelasGrid(){ kelasFolderView = null; renderKelasContent(); }
    function openPreviewById(idTemplate){
      const tpl = currentTemplates.find(t => t.ID_TEMPLATE === idTemplate);
      if (tpl) openPreview(tpl);
    }

    function renderDashboardContent(){
      const main = qs('#main-content');
      const nama = currentUser?.NAMA_GURU || 'Guru';
      main.innerHTML = `
        <div class="eyebrow">Ringkasan</div>
        <h3>Selamat datang, ${nama}</h3>
        <p class="placeholder-text">Berikut ringkasan dokumen yang tersedia untuk Anda.</p>
        <div id="total-card" class="total-card hidden">
          <div class="total-icon">📚</div>
          <div class="total-info"><h2 id="stat-total">0</h2><p>Total Dokumen</p></div>
        </div>
        <div id="stats-container" class="stats-grid hidden">
          <div class="stat-card"><div class="stat-icon">🎯</div><div class="stat-info"><h4 id="stat-cp">0</h4><p>CP</p></div></div>
          <div class="stat-card"><div class="stat-icon">🗺️</div><div class="stat-info"><h4 id="stat-atp">0</h4><p>ATP</p></div></div>
          <div class="stat-card"><div class="stat-icon">📘</div><div class="stat-info"><h4 id="stat-rpp">0</h4><p>RPP</p></div></div>
          <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-info"><h4 id="stat-prota">0</h4><p>Prota</p></div></div>
          <div class="stat-card"><div class="stat-icon">🗓️</div><div class="stat-info"><h4 id="stat-promes">0</h4><p>Promes</p></div></div>
          <div class="stat-card"><div class="stat-icon">📁</div><div class="stat-info"><h4 id="stat-lainnya">0</h4><p>Dokumen Lain</p></div></div>
        </div>
      `;
      if (currentTemplates.length > 0) renderDashboardStats(currentTemplates);
    }

    function renderProfileContent(){
      if (!currentUser) return;
      qs('#main-content').innerHTML = `
        <div class="eyebrow">Akun</div>
        <h3>Informasi Profil</h3>
        <div class="content-card" style="margin-top:16px;">
          <table class="profile-table">
            <tr><td>Nama Guru</td><td>${currentUser.NAMA_GURU || '-'}</td></tr>
            <tr><td>NIP Guru</td><td>${currentUser.NIP_GURU || '-'}</td></tr>
            <tr><td>Nama Sekolah</td><td>${currentUser.NAMA_SEKOLAH || '-'}</td></tr>
            <tr><td>Kepala Sekolah</td><td>${currentUser.NAMA_KEPALA_SEKOLAH || '-'}</td></tr>
            <tr><td>NIP Kepala Sekolah</td><td>${currentUser.NIP_KEPALA_SEKOLAH || '-'}</td></tr>
            <tr><td>Kota</td><td>${currentUser.KOTA || '-'}</td></tr>
          </table>
        </div>
      `;
    }

    // ================== LOGIN ==================
    qs('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = qs('#login-id').value.trim();
      const pin = qs('#login-pin').value.trim();
      if (!id || !pin) return showToast('Isi ID dan PIN', 'error');

      const btn = e.target.querySelector('button[type="submit"]');
      setButtonLoading(btn, true, 'Masuk...');
      try {
        const res = await fetch(`${GAS_URL}?action=login&id=${encodeURIComponent(id)}&pin=${encodeURIComponent(pin)}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Login gagal');
        currentUser = data.user;
        sessionStorage.setItem('user', JSON.stringify(currentUser));
        showDashboard();
        showToast('Login berhasil', 'success');
      } catch (err) {
        console.error(err);
        showToast(err.message, 'error');
      } finally {
        setButtonLoading(btn, false);
      }
    });

    // ================== LOAD TEMPLATE LIST ==================
    async function loadTemplates(){
      const cacheKey = 'template_list_cache';
      const cached = localStorage.getItem(cacheKey);
      if (cached){
        currentTemplates = JSON.parse(cached);
        renderSidebar(currentTemplates);
        if (currentMenu === 'dashboard') renderDashboardStats(currentTemplates);
      } else {
        showContentLoader();
      }
      try {
        const res = await fetch(`${GAS_URL}?action=getTemplateList`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Gagal memuat daftar template');
        currentTemplates = data.templates;
        localStorage.setItem(cacheKey, JSON.stringify(currentTemplates));
        renderSidebar(currentTemplates);
        if (currentMenu === 'dashboard') renderDashboardStats(currentTemplates);
      } catch (err) {
        console.error(err);
        showToast(err.message, 'error');
      }
    }

    // ================== SIDEBAR (KELAS ACCORDION) ==================
    function renderSidebar(templates){
      const nav = qs('#kelas-nav');
      nav.innerHTML = '';
      const kelasGroups = {};
      templates.forEach(tpl => {
        const kelas = tpl.KELAS || 'Lainnya';
        const kategori = tpl.KATEGORI || 'Umum';
        (kelasGroups[kelas] ??= {});
        (kelasGroups[kelas][kategori] ??= []).push(tpl);
      });

      Object.keys(kelasGroups).sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).forEach(kelas => {
        const kelasDiv = document.createElement('div');
        const kelasToggle = document.createElement('button');
        kelasToggle.className = 'kelas-toggle';
        kelasToggle.innerHTML = `<span>Kelas ${kelas}</span><span class="chev">▾</span>`;
        const kategoriContainer = document.createElement('div');
        kategoriContainer.className = 'kategori-container hidden';
        kelasToggle.onclick = () => kategoriContainer.classList.toggle('hidden');

        Object.keys(kelasGroups[kelas]).sort().forEach(kategori => {
          const kategoriDiv = document.createElement('div');
          const kategoriToggle = document.createElement('button');
          kategoriToggle.className = 'kategori-toggle';
          kategoriToggle.innerHTML = `<span>${kategori}</span><span class="chev">▾</span>`;
          const dokumenList = document.createElement('ul');
          dokumenList.className = 'dokumen-list hidden';
          kategoriToggle.onclick = () => dokumenList.classList.toggle('hidden');

          kelasGroups[kelas][kategori].forEach(tpl => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = '#';
            a.textContent = tpl.JUDUL || tpl.ID_TEMPLATE;
            a.onclick = (e) => { e.preventDefault(); openPreview(tpl); };
            li.appendChild(a);
            dokumenList.appendChild(li);
          });

          kategoriDiv.appendChild(kategoriToggle);
          kategoriDiv.appendChild(dokumenList);
          kategoriContainer.appendChild(kategoriDiv);
        });

        kelasDiv.appendChild(kelasToggle);
        kelasDiv.appendChild(kategoriContainer);
        nav.appendChild(kelasDiv);
      });
    }

    // ================== DASHBOARD STATS ==================
    function renderDashboardStats(templates){
      const totalEl = qs('#stat-total');
      if (!totalEl) return; // main-content sedang menampilkan tampilan lain, lewati
      const counts = { CP:0, ATP:0, RPP:0, PROTA:0, PROMES:0, LAINNYA:0 };
      templates.forEach(tpl => {
        const kat = (tpl.KATEGORI || '').toUpperCase().trim();
        if (kat === 'CP') counts.CP++;
        else if (kat === 'ATP') counts.ATP++;
        else if (kat === 'RPP') counts.RPP++;
        else if (kat === 'PROTA' || kat === 'PROGRAM TAHUNAN') counts.PROTA++;
        else if (kat === 'PROMES' || kat === 'PROGRAM SEMESTER') counts.PROMES++;
        else counts.LAINNYA++;
      });
      qs('#stat-total').textContent = templates.length;
      qs('#total-card').classList.remove('hidden');
      qs('#stat-cp').textContent = counts.CP;
      qs('#stat-atp').textContent = counts.ATP;
      qs('#stat-rpp').textContent = counts.RPP;
      qs('#stat-prota').textContent = counts.PROTA;
      qs('#stat-promes').textContent = counts.PROMES;
      qs('#stat-lainnya').textContent = counts.LAINNYA;
      qs('#stats-container').classList.remove('hidden');
    }

    // ================== PREVIEW (dengan date-picker TANGGAL) ==================
    async function openPreview(template){
      if (!currentUser) return;
      const main = qs('#main-content');
      main.innerHTML = `<div class="spinner"></div><p class="placeholder-text" style="text-align:center;">Memuat pratinjau...</p>`;
      try {
        const filePath = template.FILE_HTML;
        const res = await fetch(`${GITHUB_RAW_BASE}${filePath}`);
        if (!res.ok) throw new Error('Template tidak ditemukan');

        currentTemplateRawHtml = await res.text();
        currentDocFile = filePath;
        currentDocTitle = template.JUDUL || 'Dokumen';
        currentTanggal = getTodayISO();

        renderPreviewUI();
        showToast('Pratinjau dimuat', 'success');
      } catch (err) {
        console.error(err);
        showToast('Template belum ditemukan di GitHub. Pastikan file sudah diunggah sesuai path FILE_HTML.', 'error');
        goBackFromPreview();
      }
    }

    function buildFilledHtml(){
      const userForFill = { ...currentUser, TANGGAL: formatTanggalIndonesia(currentTanggal) };
      let html = currentTemplateRawHtml;
      for (const key in userForFill){
        html = html.replaceAll(`{{${key}}}`, userForFill[key] || '');
      }
      return html;
    }

    function renderPreviewUI(){
      const main = qs('#main-content');
      const filledHtml = buildFilledHtml();
      main.innerHTML = `
        <div class="toolbar">
          <h3>${currentDocTitle}</h3>
          <div class="toolbar-actions">
            <label class="date-field">
              📅 <input type="date" id="tanggal-picker" value="${currentTanggal}" onchange="onTanggalChange(this.value)">
            </label>
            <button class="btn btn-danger" onclick="downloadPDF()">Unduh PDF</button>
            <button class="btn btn-info" onclick="downloadDOCX()">Unduh DOCX</button>
            <button class="btn btn-close" onclick="goBackFromPreview()">Kembali</button>
          </div>
        </div>
        <div class="preview-container">
          <iframe id="preview-frame" sandbox="allow-same-origin" srcdoc="${filledHtml.replace(/"/g, '&quot;')}"></iframe>
        </div>
      `;
    }

    function onTanggalChange(newIso){
      currentTanggal = newIso;
      const iframe = qs('#preview-frame');
      if (iframe) iframe.srcdoc = buildFilledHtml();
    }

    function goBackFromPreview(){
      // kembali ke folder kelas yang sedang dibuka (jika ada), bukan selalu ke root dashboard
      currentMenu = 'kelas';
      qsa('.menu-item').forEach(btn => btn.classList.toggle('active', btn.dataset.menu === 'kelas'));
      qs('#kelas-nav').classList.remove('hidden');
      renderKelasContent();
    }

    // ================== DOWNLOAD ==================
    async function downloadFromGAS(action){
      if (!currentUser || !currentDocFile) return;
      const btn = event.target;
      setButtonLoading(btn, true, 'Memproses...');
      try {
        const tanggalFormatted = formatTanggalIndonesia(currentTanggal);
        const url = `${GAS_URL}?action=${action}&id=${encodeURIComponent(currentUser.ID)}&file=${encodeURIComponent(currentDocFile)}&tanggal=${encodeURIComponent(tanggalFormatted)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Gagal memproses');

        const byteString = atob(data.base64);
        const uintArray = new Uint8Array(byteString.length);
        for (let i = 0; i < byteString.length; i++) uintArray[i] = byteString.charCodeAt(i);
        const blob = new Blob([uintArray], { type: data.mimeType });

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = data.fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        showToast('Unduhan dimulai', 'success');
      } catch (err) {
        console.error(err);
        showToast(err.message, 'error');
      } finally {
        setButtonLoading(btn, false);
      }
    }
    function downloadPDF(){ downloadFromGAS('generatePdf'); }
    function downloadDOCX(){ downloadFromGAS('generateDocx'); }

    // ================== LOGOUT ==================
    function logout(){
      sessionStorage.removeItem('user');
      currentUser = null;
      currentTemplates = [];
      showLogin();
      showToast('Logout berhasil', 'info');
    }
  </script>
</body>
</html>
